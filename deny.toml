# cargo-deny: licences, advisories, banned crates and sources. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained crates included. An exception goes in
# `ignore` with the advisory ID and the reason.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; a build-time macro used by gtk-rs 0.18, which Tauri 2 needs for its GTK 3 webview on Linux. Nothing newer exists for GTK 3." },
    { id = "RUSTSEC-2026-0543", reason = "chrono was declared unmaintained in 2026-09 with no fixed release. The server gets it through cedar-policy (datetime extension) and object_store (timestamps); neither has a release without it yet. Drusite's own code uses `time`. Drop when both move off chrono." },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained because it wraps chrono (RUSTSEC-2026-0543); object_store uses it to parse durations in its config. Drop with the chrono exception." },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill is unmaintained; it comes from heapless 0.7, which loro pulls in through postcard's default `heapless-cas` feature and never uses. Drop when loro turns off postcard's default features." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licences that combine with AGPL-3.0-or-later. Anything else needs a reviewed addition here.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Allowed for one crate only, with the reason.
[[licenses.exceptions]]
# SQLite's public-domain "blessing", and libtomcrypt's WTFPL, both permissive and GPL-compatible.
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]

[[licenses.exceptions]]
# Mozilla's root certificate list as Rust data, under a permissive data licence that combines
# with AGPL. Used by the server's TLS clients (PostgreSQL, S3, the KMS, OTLP).
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[licenses.private]
# Drusite's own crates aren't published; their licence is checked like everything else.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
