# An example drusite-server configuration. Every value can also come from an environment
# variable (DRUSITE__SECTION__KEY, e.g. DRUSITE__DATABASE__URL), and any value from a file by
# adding _file to its key (url_file = "/run/secrets/database-url"), so secrets needn't be here.
# `drusite-server check-config` checks a config without starting anything.

# Where users and apps reach the server. https, except for localhost.
public_url = "https://notes.example.com"

[server]
listen = "0.0.0.0:8080"
# request_timeout_secs = 30

[database]
# PostgreSQL 16 or newer, with pgvector 0.8 or newer. Connect as an ordinary role (it may own
# the database): row-level security doesn't apply to superusers or BYPASSRLS roles. pgvector
# isn't a trusted extension, so an administrator runs `CREATE EXTENSION vector;` once.
url_file = "/run/secrets/database-url"
# max_connections = 16
# migrate_on_start = true

[storage]
# Any S3-compatible store. Leave out endpoint for AWS S3, and the keys to use the standard AWS_*
# variables, a web identity token or instance metadata.
endpoint = "https://s3.example.com"
bucket = "drusite"
# region = "us-east-1"
access_key_id = "drusite"
secret_access_key_file = "/run/secrets/s3-secret-key"
# virtual_hosted_style = false
# prefix = ""

[keys]
# Where the master key comes from. It wraps each workspace's own key.
# env:     master keys in DRUSITE_MASTER_KEY (make one with `drusite-server keys generate`)
# file:    master keys in a file (path = "/run/secrets/master-key")
# transit: OpenBao or Vault Transit wraps keys itself; the master key never leaves the KMS
source = "env"
# source = "transit"
# address = "https://bao.example.com"
# key = "drusite"
# token_file = "/run/secrets/bao-token"

# Login methods. Each is off unless switched on, and one that's off has no routes at all. The
# server refuses to start with none. `drusite-server account recover <email>` prints a one-time
# sign-in link for anyone locked out.
[auth]
# Let anyone create an account with a password, passkey or magic link.
self_signup = false
# Apps sign in through the browser and get tokens bound to a key on the device.
# access_token_minutes = 10   # how long an access token lasts; apps refresh it
# device_idle_days = 30       # a device unused this long is signed out
# device_max_days = 365       # every device signs in again after this long
# session_hours = 12          # how long a browser stays signed in to the sign-in pages

[auth.passkeys]
enabled = true

[auth.password]
enabled = false
# require_totp = false

[auth.magic_link]
enabled = false
# ttl_minutes = 15

# One table per OIDC provider; the ID (here "idp") is lowercase letters, digits and _.
[auth.oidc.idp]
display_name = "Single sign-on"
issuer = "https://idp.example.com/"
client_id = "drusite"
client_secret_file = "/run/secrets/oidc-client-secret"
# Create an account on first sign-in.
auto_create = true
# Join a first sign-in to the existing account with the same email, only if the provider says
# it verified the email. Turn on only for a provider that verifies emails properly.
# link_by_verified_email = false
# Only let some people sign in: verified emails in these domains, members of these groups.
# allowed_email_domains = ["example.com"]
# allowed_groups = ["notes"]
# groups_claim = "groups"

# Needed for magic links.
# [smtp]
# host = "smtp.example.com"
# port = 587
# tls = "starttls"   # or "tls" (port 465) or "none"
# username = "drusite"
# password_file = "/run/secrets/smtp-password"
# from = "Drusite <notes@example.com>"

[search]
# Server search: Postgres full-text search, plus semantic search when [search.embeddings] is set.
# The database then holds each block's words (a tsvector) and embedding, never its text, but
# both are derived from the text and reveal what it's about. Off keeps them out.
enabled = true
# A PostgreSQL text search configuration: "simple" works for any language; a language's
# ("english", "german", …) adds stemming for it.
text_config = "simple"

# [search.embeddings]
# Any OpenAI-compatible endpoint: OpenAI, LiteLLM, Ollama, vLLM, …
# base_url = "http://litellm:4000/v1"
# model = "text-embedding-3-small"
# api_key_file = "/run/secrets/embeddings"
# dimensions = 512          # for models that can shorten their vectors
# id = "openai/text-embedding-3-small@512"   # names the vector space; defaults to the model

[telemetry]
# log_format = "json"   # or "pretty"
# Traces, metrics and logs go over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set; the other
# standard OTEL_* variables apply. otlp = false turns it off regardless.
# service_name = "drusite-server"
