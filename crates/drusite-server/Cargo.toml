[package]
name = "drusite-server"
description = "The Drusite sync server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
drusite-dpop.workspace = true
http.workspace = true
lettre = { workspace = true, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
openidconnect.workspace = true
subtle.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
webauthn-rs = { workspace = true, features = ["conditional-ui", "danger-allow-state-serialisation"] }
drusite-model.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
cedar-policy.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
getrandom.workspace = true
object_store.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp = { workspace = true, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "trace", "metrics", "logs"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "macros"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
toml.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["trace", "request-id", "timeout", "catch-panic", "sensitive-headers", "util"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }
zeroize.workspace = true

[dev-dependencies]
drusite-core = { workspace = true, default-features = false }
fastrand.workspace = true
p256 = { workspace = true, features = ["ecdsa"] }
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
