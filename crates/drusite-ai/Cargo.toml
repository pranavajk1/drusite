[package]
name = "drusite-ai"
description = "The AI provider interface and its adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true


[dependencies]
# No TLS provider of its own: the server's build brings aws-lc, the apps install ring (which
# cross-compiles to phones) and hand in their own client.
reqwest = { workspace = true, features = ["json", "stream", "rustls-no-provider"] }
bytes.workspace = true
futures-util = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
rustls = { workspace = true, features = ["ring", "std"] }

[lints]
workspace = true
