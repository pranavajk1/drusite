[package]
name = "drusite-core"
description = "The client engine and the Core API the UI talks to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["sqlite"]
# The encrypted SQLite store. Off for the browser build, which stores documents in OPFS.
sqlite = ["dep:rusqlite"]

[dependencies]
base64.workspace = true
drusite-dpop.workspace = true
sha2.workspace = true
url.workspace = true
drusite-crdt.workspace = true
drusite-model.workspace = true
getrandom.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# SQLCipher uses Apple's CommonCrypto on Apple platforms and a vendored OpenSSL elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher"] }
security-framework.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
fastrand.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
