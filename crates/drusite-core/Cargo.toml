[package]
name = "drusite-core"
description = "The client engine and the Core API the UI talks to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["sqlite"]
# The encrypted SQLite store and the in-memory search index. Off for the browser build, which
# stores documents in OPFS.
sqlite = ["dep:rusqlite", "dep:tantivy"]
# The Markdown bridge's folder watcher, for desktops.
watch = ["sqlite", "dep:notify", "dep:notify-debouncer-full"]
# The WebSocket sync driver, for native apps and tests.
net = ["sqlite", "drusite-proto/zstd", "dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:http", "dep:ureq", "dep:rustls", "dep:serde_json"]
# The local MCP endpoint, for agents on the same computer: desktops.
mcp = ["net", "dep:drusite-mcp", "dep:axum", "dep:rmcp", "dep:tower", "tokio/net"]
# AI providers (chat, embeddings), for the native apps.
ai = ["net", "dep:drusite-ai", "dep:reqwest", "dep:webpki-roots"]

[dependencies]
base64.workspace = true
blake3.workspace = true
drusite-dpop.workspace = true
sha2.workspace = true
url.workspace = true
drusite-crdt.workspace = true
drusite-formula.workspace = true
time.workspace = true
miniz_oxide.workspace = true
regex = { workspace = true, features = ["std", "unicode-perl"] }
drusite-model.workspace = true
drusite-markdown.workspace = true
drusite-mcp = { workspace = true, optional = true }
drusite-ai = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["rustls-no-provider"] }
axum = { workspace = true, optional = true, features = ["tokio", "http1"] }
rmcp = { workspace = true, optional = true, features = ["server", "transport-streamable-http-server"] }
tower = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Compressed frames only where there is a network driver: zstd is C, and the browser build
# reads and writes plain frames.
drusite-proto = { workspace = true, default-features = false }
futures-util = { workspace = true, optional = true, features = ["sink"] }
http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { workspace = true, optional = true, features = ["connect", "rustls-tls-webpki-roots"] }
# HTTP for signing in and refreshing, and the TLS provider both it and the WebSocket use: ring,
# with Mozilla's roots, because it cross-compiles to phones without extra tooling.
ureq = { workspace = true, optional = true, features = ["rustls", "json"] }
rustls = { workspace = true, optional = true, features = ["ring", "std"] }
tantivy = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
uuid.workspace = true
getrandom.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# SQLCipher uses Apple's CommonCrypto on Apple platforms and a vendored OpenSSL elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher"] }
security-framework.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { workspace = true, optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
loro.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
turmoil.workspace = true
fastrand.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
