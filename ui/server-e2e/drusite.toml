# drusite-server for the identity end-to-end test (run.sh): every login method on.
public_url = "http://localhost:18080"

[server]
listen = "127.0.0.1:18080"

[database]
url = "postgres://drusite:drusite@127.0.0.1:55499/drusite"

[storage]
bucket = "drusite"
endpoint = "http://localhost:57099"
access_key_id = "testkey"
secret_access_key = "testsecret"

[keys]
source = "env"

[auth]
self_signup = true

[auth.password]
enabled = true

[auth.passkeys]
enabled = true

[auth.magic_link]
enabled = true

[auth.oidc.kc]
display_name = "Keycloak"
issuer = "http://localhost:58180/realms/drusite"
client_id = "drusite"
client_secret = "kc-test-secret"
auto_create = true
link_by_verified_email = true
allowed_groups = ["notes"]

[smtp]
host = "127.0.0.1"
port = 51025
tls = "none"
from = "Drusite <notes@drusite.test>"
