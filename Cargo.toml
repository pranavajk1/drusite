[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pranavajk1/drusite"
authors = ["Pranava"]
publish = false

[workspace.dependencies]
# Drusite's own crates.
drusite-model = { path = "crates/drusite-model" }
drusite-crdt = { path = "crates/drusite-crdt" }
drusite-core = { path = "crates/drusite-core" }

# Third-party. Each is the newest stable release when added; bump them together.
anyhow = "1.0.105"
fastrand = "2.5.0"
getrandom = "0.4.3"
libc = "0.2.191"
loro = "1.19.1"
proptest = "1.12.0"
rusqlite = "0.43.0"
security-framework = "3.7.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7"] }
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"
