[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/pranavajk1/drusite"
authors = ["Pranava"]
publish = false

[workspace.dependencies]
# Drusite's own crates.
drusite-model = { path = "crates/drusite-model" }
drusite-crdt = { path = "crates/drusite-crdt" }
drusite-core = { path = "crates/drusite-core" }
drusite-dpop = { path = "crates/drusite-dpop" }
drusite-proto = { path = "crates/drusite-proto" }
drusite-ai = { path = "crates/drusite-ai" }
drusite-markdown = { path = "crates/drusite-markdown" }
tauri-plugin-drusite = { path = "crates/tauri-plugin-drusite" }

# Third-party. Each is the newest stable release when added; bump them together.
turmoil = "0.7.2"
ureq = { version = "3.5.2", default-features = false }
rustls = { version = "0.23.46", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false }
zstd = { version = "0.14.5", default-features = false }
prost = "0.14.6"
pulldown-cmark = { version = "0.13.6", default-features = false }
yaml-rust2 = { version = "0.13.2", default-features = false }
similar = "3.2.1"
notify = "9.0.0"
notify-debouncer-full = "0.8.0"
subtle = "2.6.1"
http = "1.5.0"
webauthn-rs = { version = "0.6.2", default-features = false }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.2"
p256 = { version = "0.14.0", default-features = false }
openidconnect = { version = "4.1.0", default-features = false }
lettre = { version = "0.11.24", default-features = false }
argon2 = "0.6.0"
anyhow = "1.0.105"
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.2"
cedar-policy = "4.15.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.10", features = ["derive", "env"] }
object_store = { version = "0.14.2", features = ["aws"] }
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
reqwest = { version = "0.13.5", default-features = false }
sqlx = { version = "0.9.1", default-features = false }
time = "0.3.55"
tokio = "1.54.1"
unicode-normalization = "0.1.26"
tantivy = { version = "0.27.0", default-features = false, features = ["lz4-compression"] }
toml = "1.2.3"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
url = "2.5.9"
fastrand = "2.5.0"
getrandom = "0.4.3"
libc = "0.2.191"
loro = "1.19.1"
proptest = "1.12.0"
rusqlite = "0.43.0"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# specta 2 has no stable release yet; tauri itself depends on 2.0 release candidates.
specta = { version = "=2.0.0-rc.28", features = ["derive", "uuid"] }
specta-serde = "=0.0.15"
specta-typescript = "=0.0.15"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri = { version = "2.12.7", features = ["isolation"] }
tauri-build = { version = "2.7.6", features = ["isolation"] }
tauri-plugin = "2.7.4"
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v7"] }
windows-sys = "0.61.2"
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
debug = "line-tables-only"
