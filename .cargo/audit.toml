# cargo-audit exceptions. Each needs a reason.
#
# Loro's: heapless 0.7 (and atomic-polyfill under it), which loro pulls in through
# postcard's default `heapless-cas` feature. Loro never uses heapless types, so the unsound code
# paths are unreachable. Drop these when loro turns off postcard's default features.
# (cargo-deny resolves features and only sees atomic-polyfill; see deny.toml.)
#
# Tauri 2's:
# - RUSTSEC-2024-0370: proc-macro-error is unmaintained; a build-time macro of gtk-rs 0.18, which
#   Tauri 2 needs for GTK 3 on Linux. Nothing newer exists for GTK 3.
# - RUSTSEC-2024-0429: glib 0.18's VariantStrIter is unsound; fixed only in glib 0.20, which
#   targets GTK 4. Linux only, and Drusite doesn't iterate GVariants.
# - RUSTSEC-2026-0543: chrono is unmaintained. It is in Cargo.lock only as an optional feature of
#   serde_with and isn't built for any target (`cargo tree -i chrono --target all` is empty).
[advisories]
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2026-0543",
    "RUSTSEC-2023-0089",
    "RUSTSEC-2026-0574",
    "RUSTSEC-2026-0575",
    "RUSTSEC-2026-0576",
    "RUSTSEC-2026-0577",
    "RUSTSEC-2026-0578",
    "RUSTSEC-2026-0579",
    "RUSTSEC-2026-0580",
    "RUSTSEC-2026-0581",
    "RUSTSEC-2026-0582",
]
