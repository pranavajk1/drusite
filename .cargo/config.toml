[alias]
# Build and run the repo's own tooling (budgets, fixtures) in release mode, so timings mean something.
xtask = "run --release --locked --package xtask --"

# getrandom 0.3 takes its browser backend from this cfg as well as its `wasm_js` feature, which
# drusite-wasm turns on.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
