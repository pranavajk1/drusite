# The server's image. The tag defaults to the chart's appVersion; pin a digest in production.
image:
  repository: ghcr.io/pranavajk1/drusite-server
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# Server nodes hold no state of their own, so more than one can run.
replicaCount: 1

# drusite-server's config file (TOML), mounted at /etc/drusite/drusite.toml. Every setting is in
# crates/drusite-server/drusite.example.toml. Keep secrets out of it: any key ending in `_file`
# reads that file, and `secret` below mounts a Secret's keys under /run/secrets/drusite/.
config: |
  public_url = "https://notes.example.com"

  [database]
  # postgres://user:password@host:5432/database, as an ordinary role (row-level security
  # doesn't apply to superusers); pgvector must be installed in the database.
  url_file = "/run/secrets/drusite/database-url"

  [storage]
  endpoint = "https://s3.example.com"
  bucket = "drusite"
  access_key_id = "drusite"
  secret_access_key_file = "/run/secrets/drusite/s3-secret-access-key"

  [keys]
  source = "file"
  path = "/run/secrets/drusite/master-key"

  [auth.passkeys]
  enabled = true

# A Secret, created outside the chart (by hand, External Secrets, Sealed Secrets...), whose keys
# are mounted as files under /run/secrets/drusite/. The default config above reads
# `database-url`, `s3-secret-access-key` and `master-key` (`drusite-server keys generate`).
secret:
  name: ""

# More environment variables: DRUSITE__SECTION__KEY overrides the config, and the standard
# OTEL_* variables configure telemetry.
env: []
envFrom: []

service:
  type: ClusterIP
  port: 8080

# A plain Ingress. Whatever routes to the server must pass WebSockets (/api/v1/sync).
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: notes.example.com
  tls: []

# Publish to web on a host of its own. The pod listens for published pages on `port` (nothing
# else is served there), the Service gets a `public` port, and `ingress` routes `host` to it, so
# the internet can reach published pages while the app's own Ingress stays private.
publish:
  enabled: false
  host: pages.example.com
  port: 8443
  ingress:
    enabled: false
    className: ""
    annotations: {}
    tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
