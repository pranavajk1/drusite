name: Image

# Builds drusite-server's container image (Dockerfile) for amd64 and arm64, natively on each, and
# on main and version tags publishes it to ghcr.io with an SBOM and build provenance, signed
# with cosign. The signature is keyless: it binds the image to this workflow through GitHub's
# OIDC token, so there is no signing key to keep. Check an image with:
#
#   cosign verify ghcr.io/pranavajk1/drusite-server:main \
#     --certificate-identity-regexp '^https://github.com/pranavajk1/drusite/\.github/workflows/image\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/drusite-server
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build${{ env.PUBLISH == 'true' && ' and push by digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    name: publish and sign
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Join the platforms under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=$(jq -r '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest > "$RUNNER_TEMP/index-digest"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: |
          digest=$(cat "$RUNNER_TEMP/index-digest")
          cosign sign --yes "$IMAGE@$digest"
          cosign verify "$IMAGE@$digest" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/image\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

  # Checks the chart and the Compose file, and on a version tag publishes the chart to
  # oci://ghcr.io/<owner>/charts/drusite at the tag's version, its appVersion the same, signed.
  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: helm lint deploy/helm/drusite --strict --set secret.name=drusite
      - run: helm template t deploy/helm/drusite --set secret.name=drusite --set ingress.enabled=true > /dev/null
      - name: Compose file
        working-directory: deploy/compose
        run: |
          mkdir secrets
          touch secrets/{postgres_password,db_password,database_url,s3.json,s3_secret_key,master_key}
          docker compose config --quiet
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF#refs/tags/v}
          helm package deploy/helm/drusite --version "$version" --app-version "$version" -d "$RUNNER_TEMP"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "$RUNNER_TEMP/drusite-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" \
            2>&1 | tee "$RUNNER_TEMP/push.log"
          echo "digest=$(grep -o 'sha256:[0-9a-f]*' "$RUNNER_TEMP/push.log" | head -1)" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign the chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ github.token }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/drusite@$digest"
