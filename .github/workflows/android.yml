name: Android

# Builds the Android app (arm64, which every phone Drusite targets is). On a version tag (`v1.2.3`,
# matching the version in crates/drusite-app/tauri.conf.json), it signs the APK and attaches it to
# a GitHub release, where Obtainium and other installers pick it up.
#
# Signing needs four repository secrets: ANDROID_KEYSTORE (the keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Every release must be
# signed with the same key, or phones refuse the update.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/**"
      - "ui/**"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NDK_VERSION: 30.0.16248370

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version crates/drusite-app/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "the tag is ${GITHUB_REF#refs/tags/}, but tauri.conf.json says $version" >&2
            exit 1
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install the Android pieces
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: Install the UI's dependencies
        working-directory: ui
        run: npm ci --no-fund
      - name: Unpack the signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "the ANDROID_KEYSTORE secret is missing" >&2; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "DRUSITE_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        working-directory: ui
        env:
          DRUSITE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DRUSITE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DRUSITE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android.sh build --apk --target aarch64 --ci
      - name: Name the APK
        run: |
          out=crates/drusite-app/gen/android/app/build/outputs/apk/universal/release
          apk=$(ls "$out"/*.apk)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          fi
          mkdir dist
          cp "$apk" "dist/drusite-${{ steps.version.outputs.version }}-arm64.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Drusite $TAG" --notes "Android (arm64). Check the APK against SHA256SUMS."
