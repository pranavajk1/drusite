name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup on the runners installs it on first use.
# Third-party actions are pinned to a full commit SHA.

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/dco.sh "$BASE" "$HEAD"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The browser version needs everything outside the platform crates to build as WebAssembly.
      - name: Build the portable crates for wasm32
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --package drusite-model --package drusite-crdt --package drusite-wasm --target wasm32-unknown-unknown --locked

  budgets:
    name: performance budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      # The RAM budget runs the real app; on Linux it needs a display. (Not in Git's bash on
      # Windows: its Perl can't configure the vendored OpenSSL build.)
      - name: Check the budgets
        if: runner.os != 'Linux'
        run: cargo xtask budgets
      - name: Check the budgets (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask budgets

  ui:
    name: UI types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The TypeScript types match the Rust Core API
        run: cargo xtask bindings --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci --no-fund
          npm run check
          npm test
      # The editor in real WebKit (the Mac app's engine) and Chromium, on the in-memory core.
      - name: Install the test browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: ui
        run: npm run test:browser
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=low

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1,cargo-vet@0.10.3,cargo-audit@0.23.0
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo vet
        run: cargo vet --locked
      - name: cargo audit
        run: cargo audit
