name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup on the runners installs it on first use.
# Third-party actions are pinned to a full commit SHA.

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/dco.sh "$BASE" "$HEAD"

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The browser version needs everything outside the platform crates to build as WebAssembly.
      - name: Build the portable crates for wasm32
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --package drusite-model --package drusite-crdt --package drusite-wasm --target wasm32-unknown-unknown --locked

  server:
    name: server on PostgreSQL ${{ matrix.postgres }}
    # The oldest PostgreSQL Drusite supports and the newest release, each with pgvector, plus an
    # S3-compatible store (versitygw) and a KMS (OpenBao Transit). Images are pinned by digest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: 16
            image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
          - postgres: 19
            image: pgvector/pgvector:0.8.7-pg19@sha256:89879f41d564f67b0c1462a491d16fcbc6de39ac10db17e7a4bba2138a5e0ba5
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DRUSITE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DRUSITE_REQUIRE_DB_TESTS: "1"
      DRUSITE_TEST_S3_ENDPOINT: http://localhost:7070
      DRUSITE_TEST_S3_BUCKET: drusite
      DRUSITE_TEST_S3_ACCESS_KEY: testkey
      DRUSITE_TEST_S3_SECRET_KEY: testsecret
      DRUSITE_TEST_TRANSIT_ADDR: http://localhost:8200
      DRUSITE_TEST_TRANSIT_TOKEN: dev-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start the S3 store and the KMS
        run: |
          mkdir -p "$RUNNER_TEMP/s3/drusite"
          docker run -d --name s3 -p 7070:7070 -v "$RUNNER_TEMP/s3:/data" \
            versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5 \
            --access testkey --secret testsecret posix /data
          docker run -d --name kms -p 8200:8200 -e BAO_DEV_ROOT_TOKEN_ID=dev-root \
            openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9 \
            server -dev -dev-listen-address=0.0.0.0:8200
          for _ in $(seq 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
          curl -sf -H "X-Vault-Token: dev-root" -X POST -d '{"type":"transit"}' http://localhost:8200/v1/sys/mounts/transit
          curl -sf -H "X-Vault-Token: dev-root" -X POST -d '{"type":"chacha20-poly1305"}' http://localhost:8200/v1/transit/keys/drusite
      - run: cargo test --package drusite-server --locked

  budgets:
    name: performance budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      # The RAM budget runs the real app; on Linux it needs a display. (Not in Git's bash on
      # Windows: its Perl can't configure the vendored OpenSSL build.)
      - name: Check the budgets
        if: runner.os != 'Linux'
        run: cargo xtask budgets
      - name: Check the budgets (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask budgets

  ui:
    name: UI types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The TypeScript types match the Rust Core API
        run: cargo xtask bindings --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci --no-fund
          npm run check
          npm test
      # The editor in real WebKit (the Mac app's engine) and Chromium, on the in-memory core.
      - name: Install the test browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: ui
        run: npm run test:browser
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=low

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1,cargo-vet@0.10.3,cargo-audit@0.23.0
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo vet
        run: cargo vet --locked
      - name: cargo audit
        run: cargo audit
