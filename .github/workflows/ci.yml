name: CI

# Runs on pull requests into main, the only way changes reach it (main is protected), so not
# again on the push that merges one.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

# The toolchain comes from rust-toolchain.toml; rustup on the runners installs it on first use.
# Third-party actions are pinned to a full commit SHA.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - name: The versions agree
        run: .github/scripts/version.sh

  check:
    name: clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    name: server on PostgreSQL 16
    # Once, on the oldest PostgreSQL Drusite supports (newer releases keep what it relies on),
    # with pgvector, plus an S3-compatible store (versitygw) and a KMS (OpenBao Transit). Images
    # are pinned by digest.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DRUSITE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DRUSITE_REQUIRE_DB_TESTS: "1"
      DRUSITE_TEST_S3_ENDPOINT: http://localhost:7070
      DRUSITE_TEST_S3_BUCKET: drusite
      DRUSITE_TEST_S3_ACCESS_KEY: testkey
      DRUSITE_TEST_S3_SECRET_KEY: testsecret
      DRUSITE_TEST_TRANSIT_ADDR: http://localhost:8200
      DRUSITE_TEST_TRANSIT_TOKEN: dev-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Start the S3 store and the KMS
        run: |
          mkdir -p "$RUNNER_TEMP/s3/drusite"
          docker run -d --name s3 -p 7070:7070 -v "$RUNNER_TEMP/s3:/data" \
            versity/versitygw:v1.11.0@sha256:8319a530d08d537426e2f855bae5280709795dc73a3f0c347973ef915d6343c5 \
            --access testkey --secret testsecret posix /data
          docker run -d --name kms -p 8200:8200 -e BAO_DEV_ROOT_TOKEN_ID=dev-root \
            openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9 \
            server -dev -dev-listen-address=0.0.0.0:8200
          for _ in $(seq 30); do curl -sf http://localhost:8200/v1/sys/health >/dev/null && break; sleep 1; done
          curl -sf -H "X-Vault-Token: dev-root" -X POST -d '{"type":"transit"}' http://localhost:8200/v1/sys/mounts/transit
          curl -sf -H "X-Vault-Token: dev-root" -X POST -d '{"type":"chacha20-poly1305"}' http://localhost:8200/v1/transit/keys/drusite
      - run: cargo test --package drusite-server --locked

  simulation:
    name: sync simulation
    # Real cores through network chaos in turmoil; every edit must survive (see
    # crates/drusite-core/tests/simulation.rs). Too slow for the ordinary test run, so it's
    # ignored there and runs here. The stores go to RAM: each core's SQLCipher store syncs every
    # write to disk, which is most of the time on a CI runner's disk.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMPDIR: /dev/shm
      DRUSITE_SIM_SEEDS: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --package drusite-core --test simulation --release --locked -- --ignored --nocapture

  budgets:
    name: performance budgets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The app embeds the built UI, so it has to exist before anything compiles drusite-app.
      - name: Build the UI
        working-directory: ui
        shell: bash
        run: npm ci --no-fund && npm run build
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev xvfb
      # The RAM budget runs the real app; on Linux it needs a display. (Not in Git's bash on
      # Windows: its Perl can't configure the vendored OpenSSL build.)
      - name: Check the budgets
        if: runner.os != 'Linux'
        run: cargo xtask budgets
      - name: Check the budgets (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask budgets

  wasm:
    name: the core as WebAssembly
    # The browser version: the core and its adapter built for wasm32 (clippy too), and the
    # JavaScript glue the web app loads it with, for the jobs below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # SQLCipher is C: clang compiles it for wasm32, and llvm-ar archives it so the linker can
      # find its symbols (the system ar can't index wasm objects).
      - name: Install wasm-bindgen and llvm-ar
        run: |
          rustup component add llvm-tools
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Clippy for wasm32
        run: |
          export AR_wasm32_unknown_unknown="$(find "$(rustc --print sysroot)/lib/rustlib" -name llvm-ar -type f | head -1)"
          cargo clippy --package drusite-wasm --package drusite-core --package drusite-proto --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build
        working-directory: ui
        run: scripts/wasm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: ui/src/core/web/wasm/
          retention-days: 3
          if-no-files-found: error

  ui:
    name: UI types and tests
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The TypeScript types match the Rust Core API
        run: cargo xtask bindings --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The web transport's types come from the core's JavaScript glue.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: ui/src/core/web/wasm/
      - name: Type-check and test the UI
        working-directory: ui
        run: |
          npm ci --no-fund
          npm run check
          npm test
      # The editor in real WebKit (the Mac app's engine) and Chromium, on the in-memory core.
      - name: Install the test browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium webkit
      - name: Browser tests
        working-directory: ui
        run: npm run test:browser
      - name: npm audit
        working-directory: ui
        run: npm audit --audit-level=low

  web:
    name: the web app (${{ matrix.browser }})
    # The browser version as served: built with its download budget checked, then the UI's
    # specs and its own against the real WebAssembly core, in each engine. Chromium also
    # checks the tab's memory budget.
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: ui/src/core/web/wasm/
      - name: Build the web app and check its download budget
        working-directory: ui
        run: |
          npm ci --no-fund
          npm run build:web
      - name: Install the test browser
        working-directory: ui
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests on the WebAssembly core
        working-directory: ui
        run: npm run test:web -- --project ${{ matrix.browser }}

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny@0.22.1,cargo-vet@0.10.3,cargo-audit@0.23.0
      - name: cargo deny
        run: cargo deny --locked check
      - name: cargo vet
        run: cargo vet --locked
      - name: cargo audit
        run: cargo audit
